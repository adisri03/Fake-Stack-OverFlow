<body>
  <div id="header" class="header">
    <input type="text" placeholder="Search..."/>
    <h1 id"title">Fake Stack Overflow</h1>
  </div>

  <div class="sidenav">
    <a href="index.html">Questions</a>
    <a href="#tags.html">Tags</a>
  </div>

  <div class="top" id="top">
    <div class="container">
      <h1>All Questions</h1>
      <button id="submit">Ask Questions</button>
      <button id="new">Newest</button>
      <button id="active">Active</button>
      <button id="unans">Unanswered</button>
    </div>
  </div>

  <div class="q1">
    <p id="test"></p>
    <script src="src/model.js">
      document.getElementById("demo").innerHTML = this.data
    </script>
  </div>

  <div class="question">
    <form class="quest" id="form">

      <h1>Question Title*</h1>
      <h4 id="titleError">Limit title to 100 chacter max</h4>
      <input type="text" id="questionTitle" name="qTitle">
      <span id="error1"></span>

      <h1>Question Text*</h1>
      <h4 id="textError"> Add Details</h4>
      <textarea type="text" id="questionText"></textarea>
      <span id="error2"></span>

      <h1>Tags*</h1>
      <h4 id="tagError"> Add keywords seperated by a space</h4>
      <textarea type="text" id="tagText"></textarea>
      <span id="error3"></span>

      <h1>Username*</h1>
      <textarea type="text" id="userName"></textarea>
      <span id="error4"></span>

      <br><input id="post" type="submit" value="Post">

    </form>
  </div>
  

</body>
